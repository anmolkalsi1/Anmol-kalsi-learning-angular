<mat-card class="mat-elevation-z3 app-content-list-item">
  <mat-card-header>
    <mat-card-title>{{ restaurants.type }}</mat-card-title>
    <mat-card-subtitle>Company: {{ restaurants.Company }}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image [src]="restaurants.imageURL" alt="{{ restaurants.type }}">
  <mat-card-actions>
    <button mat-raised-button color="primary">Get restaurant</button>
  </mat-card-actions>
</mat-card>
