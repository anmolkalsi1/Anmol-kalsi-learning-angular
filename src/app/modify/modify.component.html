<form [formGroup]="restaurantForm" (ngSubmit)="onSubmit()">
  <!-- Name Field -->
  <div class="form-group">
    <label for="name">Name:</label>
    <input id="name" formControlName="name" class="form-control" />
    <div *ngIf="restaurantForm.get('name')?.invalid && restaurantForm.get('name')?.touched" class="error-message">
      <div *ngIf="restaurantForm.get('name')?.hasError('required')">
        Name is required.
      </div>
      <div *ngIf="restaurantForm.get('name')?.hasError('pattern')">
        Name should not contain special characters.
      </div>
    </div>
  </div>

  <!-- Description Field -->
  <div class="form-group">
    <label for="description">Description:</label>
    <input id="description" formControlName="description" class="form-control" />
    <div *ngIf="restaurantForm.get('description')?.invalid && restaurantForm.get('description')?.touched" class="error-message">
      <div *ngIf="restaurantForm.get('description')?.hasError('required')">
        Description is required.
      </div>
    </div>
  </div>

  <!-- Hidden ID Field -->
  <input type="hidden" formControlName="id">

  <!-- Submit Button -->
  <button type="submit" [disabled]="restaurantForm.invalid" class="btn btn-primary">Save</button>

  <!-- Cancel Button -->
  <button type="button" (click)="router.navigate(['/list'])" class="btn btn-secondary">Cancel</button>
</form>
